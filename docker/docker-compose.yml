services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ${CONTAINER_NAME:-hotel-management-sql}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mssql-data:
    driver: local
