name: Dev to Main Auto Merge

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate Dev Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  promote:
    name: Create PR and Enable Auto Merge
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Ensure PR from dev to main exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head dev \
              --title "chore: promote dev to main" \
              --body "Automated promotion PR from dev to main after CI passed."

            PR_NUMBER=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Enable auto merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --merge || true
